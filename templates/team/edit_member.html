{% extends "layouts/base.html" %}

{% block title %}
Edit Team Member
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3 class="mb-0">
                Edit Team Member
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="{{ member.user.full_name }}"
                        readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        value="{{ member.user.email }}"
                        readonly>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <select
                        name="role"
                        class="form-select">

                        <option value="Member"
                        {% if member.role == "Member" %}selected{% endif %}>
                            Member
                        </option>

                        <option value="Developer"
                        {% if member.role == "Developer" %}selected{% endif %}>
                            Developer
                        </option>

                        <option value="Designer"
                        {% if member.role == "Designer" %}selected{% endif %}>
                            Designer
                        </option>

                        <option value="Tester"
                        {% if member.role == "Tester" %}selected{% endif %}>
                            Tester
                        </option>

                        <option value="Project Manager"
                        {% if member.role == "Project Manager" %}selected{% endif %}>
                            Project Manager
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success">

                    Save Changes

                </button>

                <a
                    href="{{ url_for('team.manage_team', project_id=member.project_id) }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

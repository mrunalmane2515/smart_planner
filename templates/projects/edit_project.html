{% extends "layouts/base.html" %}

{% block title %}
Edit Project
{% endblock %}

{% block content %}

<h2>Edit Project</h2>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">

            Project Name

        </label>

        <input
            type="text"
            class="form-control"
            name="name"
            value="{{ project.name }}"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Description

        </label>

        <textarea
            class="form-control"
            rows="5"
            name="description">{{ project.description }}</textarea>

    </div>

    <button class="btn btn-success">

        Update Project

    </button>

</form>

{% endblock %}

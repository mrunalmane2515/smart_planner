{% extends "layouts/base.html" %}

{% block title %}
Create Project
{% endblock %}

{% block content %}

<h2>Create New Project</h2>

<form method="POST">

    <div class="mb-3">

        <label class="form-label">

            Project Name

        </label>

        <input
            type="text"
            class="form-control"
            name="name"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">

            Description

        </label>

        <textarea
            class="form-control"
            rows="5"
            name="description"></textarea>

    </div>

    <button
        class="btn btn-success">

        Create Project

    </button>

</form>

{% endblock %}

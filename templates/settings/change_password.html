{% extends "layouts/base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-danger text-white">

                    <h4 class="mb-0">
                        <i class="bi bi-key-fill"></i>
                        Change Password
                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Current Password
                            </label>

                            <input
                                type="password"
                                name="current_password"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                New Password
                            </label>

                            <input
                                type="password"
                                name="new_password"
                                class="form-control"
                                minlength="6"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm New Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                minlength="6"
                                required>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('settings.settings_page') }}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>
                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-danger">

                                <i class="bi bi-check-circle-fill"></i>
                                Update Password

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

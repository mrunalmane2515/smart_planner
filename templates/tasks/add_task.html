{% extends "layouts/base.html" %}

{% block title %}
Add Task
{% endblock %}

{% block content %}

<h2>Add Task</h2>

<form method="POST" enctype="multipart/form-data">

    <div class="mb-3">

        <label class="form-label">Task Title</label>

        <input
            type="text"
            name="title"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">Description</label>

        <textarea
            name="description"
            class="form-control"
            rows="4"></textarea>

    </div>

    <div class="mb-3">

        <label class="form-label">Priority</label>

        <select
            name="priority"
            class="form-select">

            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>

        </select>

    </div>

    <div class="mb-3">

    <label class="form-label">

        <strong>Task Tags</strong>

    </label>
    
    <div class="row">

        {% for tag in tags %}

        <div class="col-md-3 mb-2">

            <div class="form-check">

                <input
                    class="form-check-input"
                    type="checkbox"
                    name="tags"
                    value="{{ tag.id }}"
                    id="tag{{ tag.id }}">

                <label
                    class="form-check-label"
                    for="tag{{ tag.id }}">

                    <span class="badge bg-{{ tag.color }}">

                        {{ tag.name }}

                    </span>

                </label>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

    <div class="mb-3">

        <label class="form-label">Status</label>

          <select
            name="status"
            class="form-select">

            <option selected>To Do</option>
            <option>In Progress</option>
            <option>Completed</option>

        </select>
        <div class="mb-3">

    <label class="form-label">
        Assign To
    </label>

    <select
        name="assigned_to"
        class="form-select">

        <option value="">
            -- Unassigned --
        </option>

        {% for member in members %}

        <option value="{{ member.id }}">
            {{ member.user.full_name }} ({{ member.role }})
        </option>

        {% endfor %}

    </select>

</div>



    </div>

    <div class="mb-3">

        <label class="form-label">Due Date</label>

        <input
            type="date"
            name="due_date"
            class="form-control">

    </div>

    <div class="mb-3">

        <label class="form-label">Attachment</label>

        <input
            type="file"
            name="attachment"
            class="form-control">

        <small class="text-muted">

            Upload PDF, Image, Word, Excel, ZIP, etc.

        </small>

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Save Task

    </button>

    <a href="{{ url_for('project.projects') }}"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}

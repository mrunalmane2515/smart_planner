{% extends "layouts/base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        <i class="bi bi-person-gear"></i>
                        Edit Profile
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST"
                          enctype="multipart/form-data">

                        <div class="text-center mb-4">

                            <img
                                src="{{ url_for('static', filename='profile_pictures/' + current_user.profile_image) }}"
                                class="rounded-circle border shadow"
                                width="150"
                                height="150"
                                style="object-fit: cover;">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                value="{{ current_user.full_name }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ current_user.email }}"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Profile Picture

                            </label>

                            <input
                                type="file"
                                name="profile_image"
                                class="form-control"
                                accept="image/*">

                            <small class="text-muted">

                                Leave empty to keep your current picture.

                            </small>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{{ url_for('profile.user_profile') }}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>
                                Cancel

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-check-circle"></i>
                                Save Changes

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Planner </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="auth-wrapper">

    <div class="auth-left">

        <div class="auth-logo">
            📋 Smart Planner
        </div>

        <h1>
            Organize.
            <br>
            Collaborate.
            <br>
            Achieve.
        </h1>

        <p>
            Manage projects, tasks, teams, analytics,
            AI insights and productivity from one dashboard.
        </p>

    </div>

    <div class="auth-right">

        <h2 class="auth-title">
            Welcome Back 👋
        </h2>

        <p class="auth-subtitle">
            Login to continue
        </p>

        <form method="POST">

            <div class="form-group">

                <label>Email</label>

                <div class="input-group">

                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Email"
                        required>

                </div>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="input-group">

                    <i class="bi bi-lock"></i>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Password"
                        required>

                    <i class="bi bi-eye password-toggle"
                       id="togglePassword"></i>

                </div>

            </div>

            <button
                type="submit"
                class="btn-auth">

                Login

            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('auth.register') }}">

                Register

            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>

</html>

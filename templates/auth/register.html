<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Planner</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="auth-wrapper">

    <!-- LEFT PANEL -->

    <div class="auth-left">

        <div class="auth-logo">

            📋 Smart Planner

        </div>

        <h1>

            Build Better
            <br>
            Projects
            <br>
            Together.

        </h1>

        <p>

            Create projects, manage tasks,
            collaborate with teams,
            upload files,
            view analytics,
            and boost productivity using AI.

        </p>

    </div>

    <!-- RIGHT PANEL -->

    <div class="auth-right">

        <div class="auth-title">

            Create Account 🚀

        </div>

        <div class="auth-subtitle">

            Start managing your work today.

        </div>

        <form method="POST">

            <div class="form-group">

                <label class="form-label">

                    Full Name

                </label>

                <div class="input-group">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>

                </div>

            </div>

            <div class="form-group">

                <label class="form-label">

                    Email

                </label>

                <div class="input-group">

                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>

            <div class="form-group">

                <label class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <i class="bi bi-lock"></i>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create password"
                        required>

                    <i
                        class="bi bi-eye password-toggle"
                        id="togglePassword"></i>

                </div>

            </div>

            <div class="form-group">

                <label class="form-label">

                    Confirm Password

                </label>

                <div class="input-group">

                    <i class="bi bi-shield-lock"></i>

                    <input
                        id="confirmPassword"
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Confirm password"
                        required>

                </div>

            </div>

            <button
                type="submit"
                class="btn-auth">

                Create Account

            </button>

        </form>


        <div class="auth-footer">

            Already have an account?

            <a href="{{ url_for('auth.login') }}">

                Login

            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>

</html>
